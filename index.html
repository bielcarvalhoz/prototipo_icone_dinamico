<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Alvo SVG exato — corrigido</title>
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;color:#eaf0ff;background:#080c18;overflow-x:clip}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  .bg{position:fixed;inset:0;z-index:0;background:
      radial-gradient(900px 600px at 50% 42%, rgba(204,9,47,.14), transparent 68%),
      linear-gradient(180deg,#070b1a 0%,#0c142c 65%,#0f1f3f 100%)}
  .wrap{position:relative;z-index:1}
  section{min-height:110vh;display:grid;place-items:center;padding:6vh 5vw}
  .card{width:min(720px,92vw);padding:30px 26px;border-radius:22px;background:rgba(16,22,42,.66);
        backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.13);box-shadow:0 18px 48px rgba(0,0,0,.32)}
  h1{margin:0 0 10px;font-size:clamp(28px,5vw,48px);line-height:1.02;letter-spacing:-.02em}
  p{margin:0;color:#a8b3cc;line-height:1.65}
  .tag{display:inline-block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#ffb0c0;
       background:rgba(204,9,47,.18);border:1px solid rgba(204,9,47,.38);padding:6px 10px;border-radius:999px;margin-bottom:12px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="bg"></div>
<canvas id="c"></canvas>
<div class="wrap">
  <section>
    <div class="card">
      <div class="tag">SVG exato • cada ilha sólida • sem vazado</div>
      <h1>Seu ícone exato, com barra grossa</h1>
      <p>Voltei pro seu SVG original e corrigi extrudando <strong>cada das 7 ilhas</strong> como sólido separado — mesmo formato, agora sem vazado e com a mesma estilização.</p>
    </div>
  </section>
  <section><div class="card"><h1 style="font-size:26px">Scroll</h1><p>Gira e cresce do centro.</p></div></section>
  <section><div class="card"><h1 style="font-size:26px">Vazado</h1><p>Só onde seu SVG é vazado.</p></div></section>
</div>

<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
gsap.registerPlugin(ScrollTrigger);

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0.6,7.8); camera.lookAt(0,0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.95));
const sun=new THREE.DirectionalLight(0xffffff,1.35); sun.position.set(3,5,4); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); scene.add(sun);
const rim=new THREE.DirectionalLight(0xffb0c0,0.5); rim.position.set(-2,1,-3); scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(4.5,64), new THREE.ShadowMaterial({opacity:0.30}));
ground.rotation.x=-Math.PI/2; ground.position.y=-1.65; ground.receiveShadow=true; scene.add(ground);

const alvo=new THREE.Group(); scene.add(alvo);
const matFront=new THREE.MeshStandardMaterial({color:0xCC092F, roughness:0.30, metalness:0.05, side:THREE.DoubleSide});
const matSide=new THREE.MeshStandardMaterial({color:0x7a051c, roughness:0.55, side:THREE.DoubleSide});
const depth=22;

const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><path fill="#CC092F" fill-rule="evenodd" clip-rule="evenodd" d="M258 499.749C392.369 495.525 500 385.269 500 249.874C500 114.48 392.369 4.22405 258 0V71.05C353.147 75.2347 429 153.696 429 249.874C429 346.053 353.147 424.514 258 428.699V499.749ZM241 499.715C107.097 494.977 0 384.933 0 249.874C0 114.816 107.097 4.77149 241 0.0334085V71.0968C146.323 75.7851 71 154.033 71 249.874C71 345.715 146.323 423.964 241 428.652V499.715ZM241 106.151C168.473 110.624 110.472 168.781 106.247 241.374H140.868C145.226 188.297 187.788 146.043 241 142.165V106.151ZM241 358.584C187.454 354.682 144.693 311.92 140.79 258.374H106.247C110.472 330.968 168.473 389.125 241 393.598V358.584ZM258 393.656V358.506C311.077 354.148 353.332 311.587 357.21 258.374H393.753C389.508 331.301 330.993 389.659 258 393.656ZM258 142.242V106.093C330.993 110.09 389.508 168.448 393.753 241.374H357.132C352.801 188.63 310.745 146.573 258 142.242ZM249.5 328.874C293.13 328.874 328.5 293.505 328.5 249.874C328.5 206.244 293.13 170.874 249.5 170.874C205.87 170.874 170.5 206.244 170.5 249.874C170.5 293.505 205.87 328.874 249.5 328.874Z"/></svg>`;

const loader=new SVGLoader();
const data=loader.parse(svgString);

// cada subPath é uma ilha vermelha sólida — extruda separado mantendo posição relativa
const subPaths=data.paths[0].subPaths;
console.log('ilhas', subPaths.length);
subPaths.forEach((sp, i)=>{
  const pts=sp.getPoints(32);
  if(pts.length<3) return;
  const shape=new THREE.Shape(pts);
  const geo=new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled:true, bevelThickness:1.2, bevelSize:0.9, bevelSegments:3, steps:1});
  geo.translate(-250, -250, -depth/2);
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo, [matFront, matSide]);
  // corrige inversão Y do SVG
  mesh.scale.y *= -1;
  mesh.castShadow=true; mesh.receiveShadow=true;
  alvo.add(mesh);
});

alvo.updateMatrixWorld(true);
const box=new THREE.Box3().setFromObject(alvo);
const ctr=new THREE.Vector3(); box.getCenter(ctr);
alvo.position.sub(ctr);
alvo.scale.set(0.0064,0.0064,0.0064);
alvo.position.y+=0.04;

gsap.set(alvo.scale,{x:0.0022,y:0.0022,z:0.0022});
gsap.set(alvo.rotation,{y:-0.72, x:0.15});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){
  gsap.set(alvo,{scale:{x:0.0064,y:0.0064,z:0.0064}, rotation:{x:0,y:0}});
} else {
  const tl=gsap.timeline({scrollTrigger:{trigger:document.body, start:"top top", end:"bottom bottom", scrub:1.05}});
  tl.to(alvo.scale,{x:0.0064,y:0.0064,z:0.0064, duration:0.72, ease:"back.out(1.15)"},0);
  tl.to(alvo.rotation,{y:0.85, x:-0.11, duration:0.72, ease:"none"},0);
  tl.to(alvo.rotation,{y:1.45, x:-0.15, duration:0.30, ease:"none"},0.72);
}
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
(function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();
</script>
</body>
</html>
